name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build python3-dbus python3-gi libgl1 libegl1 libxkbcommon0
      - name: 准备构建 venv（与本地 --system-site-packages 一致）
        run: |
          uv venv --system-site-packages .build-venv
          uv pip install --python .build-venv/bin/python PySide6 PyInstaller meson
      - name: 下载 appimagetool
        run: |
          mkdir -p .build-tools
          curl -fsL \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o .build-tools/appimagetool-x86_64.AppImage
          chmod +x .build-tools/appimagetool-x86_64.AppImage
      - name: 构建 AppImage
        run: bash packaging/appimage/build.sh
      - uses: actions/upload-artifact@v6
        with:
          name: appimage
          path: dist/*

  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: 安装 flatpak 与构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          # 与 manifest 对齐的运行时依赖（构建走宿主 flatpak-builder CLI）
          flatpak install --user --noninteractive flathub \
            org.kde.Platform//6.11 org.kde.Sdk//6.11 \
            io.qt.PySide.BaseApp//6.11
      - name: 构建 Flatpak
        run: bash packaging/flatpak/build.sh
      - uses: actions/upload-artifact@v6
        with:
          name: flatpak
          path: dist/*

  release:
    needs: [appimage, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          merge-multiple: true
          path: dist
      - name: 从 CHANGELOG 提取发布说明
        run: |
          version="${GITHUB_REF_NAME#v}-linux"
          # header 不含 "## " 前缀；用 index() 做字面前缀匹配（版本号里的
          # "." 在动态正则中虽可接受，但字符串匹配不受任何转义影响）
          awk -v header="${version}" '
            index($0, "## " header) == 1 { found = 1; next }
            /^## / { found = 0 }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' -e '${/^$/d}' > changelog-section.md
          if [[ ! -s changelog-section.md ]]; then
            echo "CHANGELOG.md 中缺少 ${version} 小节，拒绝静默发布空说明" >&2
            exit 1
          fi
          { echo "## PasteMD Linux ${GITHUB_REF_NAME}"; echo; cat changelog-section.md
          } > release-notes.md
      - name: 校验 metainfo 版本条目
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "<release version=\"${version}\"" \
            packaging/common/io.github.GMagisk9527.PasteMDLinux.metainfo.xml || {
            echo "metainfo.xml 缺少 ${version} 的 <release> 条目，应用商店会显示过期版本；" >&2
            echo "请在 packaging/common/io.github.GMagisk9527.PasteMDLinux.metainfo.xml 补充后重新打 tag" >&2
            exit 1
          }
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "PasteMD Linux ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            dist/*
