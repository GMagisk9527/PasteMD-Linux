name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build python3-dbus python3-gi libgl1 libegl1 libxkbcommon0
      - name: 准备构建 venv（与本地 --system-site-packages 一致）
        run: |
          uv venv --system-site-packages .build-venv
          uv pip install --python .build-venv/bin/python PySide6 PyInstaller meson
      - name: 下载 appimagetool
        run: |
          mkdir -p .build-tools
          curl -fsL \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o .build-tools/appimagetool-x86_64.AppImage
          chmod +x .build-tools/appimagetool-x86_64.AppImage
      - name: 构建 AppImage
        run: bash packaging/appimage/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*

  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 flatpak 与 Builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak
          flatpak remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --system --noninteractive \
            org.flatpak.Builder//stable
      - name: 构建 Flatpak
        run: bash packaging/flatpak/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/*

  release:
    needs: [appimage, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: 从 CHANGELOG 提取发布说明
        run: |
          version="${GITHUB_REF_NAME#v}-linux"
          { echo "## PasteMD Linux ${GITHUB_REF_NAME}"; echo;
            awk -v header="## ${version}" '
              $0 ~ "^## " header { found = 1; next }
              /^## / { found = 0 }
              found { print }
            ' CHANGELOG.md | sed -e '/./,$!d' -e '${/^$/d}'
          } > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG 中没有 ${version} 小节" >&2; exit 1; }
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "PasteMD Linux ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            dist/*
