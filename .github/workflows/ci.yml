name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v8.3.2
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wl-clipboard libgl1 libegl1 libxkbcommon0 shellcheck \
            python3-dbus python3-gi
      # 黄金测试锁的是 pandoc 3.7 的 AST 行为，必须与 vendored 版本一致。
      # runner 预装了旧版 pandoc 且 GITHUB_PATH 是追加（优先级低），
      # 因此直接覆盖 /usr/local/bin。
      - name: 固定 pandoc 3.7.0.2
        run: |
          curl -fsSL \
            https://github.com/jgm/pandoc/releases/download/3.7.0.2/pandoc-3.7.0.2-linux-amd64.tar.gz \
            -o /tmp/pandoc.tar.gz
          tar -xzf /tmp/pandoc.tar.gz -C /tmp
          sudo cp /tmp/pandoc-3.7.0.2/bin/pandoc /usr/local/bin/pandoc
          sudo cp /tmp/pandoc-3.7.0.2/bin/pandoc /usr/bin/pandoc
          which -a pandoc
          pandoc --version | head -1
      - name: 安装 Python 依赖
        run: uv pip install --system PySide6
      - name: 静态检查（ruff + shellcheck）
        run: |
          uv tool run ruff@0.16.8 check pastemd/ scripts/ tests/ --select E4,E7,E9,F
          shellcheck -S warning packaging/appimage/build.sh packaging/flatpak/build.sh scripts/smoke/smoke_md_rule_flow.sh
      - name: 运行测试
        env:
          QT_QPA_PLATFORM: offscreen
          # apt 的 dbus/gi 装在系统 dist-packages（3.12 ABI 兼容 hostedtoolcache）
          PYTHONPATH: /usr/lib/python3/dist-packages
          # 黄金测试只认官方 3.7.0.2（测试内部会校验 api-version）
          PASTEMD_PANDOC_BIN: /usr/local/bin/pandoc
        run: python -m unittest discover -s tests -p 'test_*.py' -v
